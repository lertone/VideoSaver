name: build-all

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        shell: bash
        run: |
          V=$(grep -m1 '^APP_VERSION' server.py | cut -d'"' -f2)
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev libcairo2-dev pkg-config \
            python3-gi gir1.2-webkit2-4.0 gir1.2-webkit2-4.1 || true

      - name: Install python deps
        shell: bash
        run: |
          python -m pip install -U pip
          pip install pyinstaller pywebview pillow websocket-client imageio-ffmpeg
          if [ "$RUNNER_OS" = "Windows" ]; then pip install pystray; fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            pip install pyobjc-framework-Cocoa pyobjc-framework-WebKit
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install PyGObject || true
          fi

      - name: Fetch binaries
        run: python tools/fetch_bin.py

      - name: Build app bundle
        run: python build_app.py

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          python build_installer.py --version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: VideoSaver-${{ matrix.name }}
          path: |
            release/*
            installer_out/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
            installer_out/*.exe
